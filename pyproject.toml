[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".hf_cache",
    ".venv",
    "lm-evaluation-harness",
    "MODELS",
    "RESULTS",
]

[tool.ruff.lint]
# Enforce syntax and other fatal static errors across the legacy codebase.
# CI applies the broader E/F rule set to its new scripts and tests separately.
select = ["E9", "F63", "F7", "F82"]
